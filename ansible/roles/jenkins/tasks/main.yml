---
- name: Update APT cache
  apt:
    update_cache: yes

- name: Install required dependencies (fontconfig + OpenJDK 21)
  apt:
    name:
      - fontconfig
      - openjdk-21-jre
      - wget
      - gnupg2
      - curl
    state: present
    update_cache: yes

- name: Verify Java installation
  command: java -version
  register: java_version
  ignore_errors: yes

- name: Print Java version
  debug:
    msg: "{{ java_version.stderr_lines }}"

- name: Create Jenkins keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Jenkins GPG key (2023 version)
  get_url:
    url: https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key
    dest: /etc/apt/keyrings/jenkins-keyring.asc
    mode: '0644'

- name: Add Jenkins repository
  copy:
    content: |
      deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/
    dest: /etc/apt/sources.list.d/jenkins.list
    owner: root
    group: root
    mode: '0644'

- name: Update package cache after adding Jenkins repo
  apt:
    update_cache: yes

- name: Install Jenkins
  apt:
    name: jenkins
    state: present

- name: Ensure Jenkins is started and enabled
  systemd:
    name: jenkins
    enabled: yes
    state: started

