version: '3.9'

networks:
  app-network:
    driver: bridge

volumes:
  backend-logs:
  nginx-cache:

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: gw-dashboard-backend:latest
    container_name: gw-backend
    hostname: backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
    env_file:
      - ./backend/.env.production
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    volumes:
      - backend-logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: gw-dashboard-frontend:latest
    container_name: gw-frontend
    hostname: frontend
    ports:
      - "80:80"
    env_file:
      - ./frontend/.env.production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    volumes:
      - nginx-cache:/var/cache/nginx
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

